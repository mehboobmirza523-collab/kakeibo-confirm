<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kakeibo · Email confirmed</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#0b0720,#1d0b44 55%,#3b1380);color:#1b1533}
.card{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 24px 60px #0008}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;font-weight:800;font-size:20px;color:#4c1d95}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#fff1b8,#f5c542 45%,#b8860b);display:grid;place-items:center;font-size:21px;font-weight:900;color:#5b3d02}
.tick{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#5b21b6,#7c3aed 55%,#a78bfa);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:800;box-shadow:0 12px 30px #6d28d94d}
h1{font-size:26px;margin:6px 0 8px;letter-spacing:-.5px}
p{color:#6b6785;line-height:1.55;font-size:15px;margin:0 0 18px}
.steps{text-align:left;display:grid;gap:10px;margin-top:20px}
.step{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:#faf9ff;border:1px solid #ece8fb;font-size:14px;font-weight:600}
.n{width:26px;height:26px;border-radius:50%;background:#7c3aed;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.foot{margin-top:22px;font-size:12px;color:#8a86a3}
</style>
</head>
<body>
<main class="card">
<div class="brand"><span class="logo">K</span>Kakeibo</div>
<div class="tick" id="k">✓</div>
<h1 id="t">Email confirmed</h1>
<p id="m">Your account is ready. Open the Kakeibo app and log in with your email and password.</p>
<div class="steps" id="s">
<div class="step"><span class="n">1</span>Go back to the Kakeibo app</div>
<div class="step"><span class="n">2</span>Tap Log in</div>
<div class="step"><span class="n">3</span>Enter your email and password</div>
</div>
<div class="foot">The art of mindful money · You can close this page</div>
</main>
<script>
(function () {
  var h = location.hash || "";
  var bad = /error/i.test(h);
  if (h) { history.replaceState(null, "", location.pathname + location.search); }
  if (bad) {
    document.getElementById("k").textContent = "!";
    document.getElementById("t").textContent = "This link has expired";
    document.getElementById("m").textContent = "Open the Kakeibo app, sign up again, and we will send you a fresh link.";
    document.getElementById("s").style.display = "none";
  }
})();
</script>
</body>
</html>
